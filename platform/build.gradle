plugins {
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
    id 'jacoco'
    id 'org.cyclonedx.bom' version '1.10.0'
}

def javaMajor = JavaVersion.current().majorVersion.toInteger()
if (javaMajor > 19) {
    throw new GradleException(
            "TraceWitness uses Gradle 7.6.4, which supports Java 8-19. Current Java is ${JavaVersion.current()}. " +
            "Set JAVA_HOME to JDK 8, or run run_eval.bat / run_mock.bat from the repository root.")
}

group = 'com.tracewitness'
version = '0.4.0'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

ext['tomcat.version'] = '9.0.123'
ext['spring-framework.version'] = '5.3.39'
ext['jackson-bom.version'] = '2.23.0'
ext['snakeyaml.version'] = '2.7'
ext['logback.version'] = '1.2.13'
ext['log4j2.version'] = '2.26.1'
ext['flyway.version'] = '9.22.3'
ext['h2.version'] = '2.2.220'

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.swagger.parser.v3:swagger-parser:2.1.48'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation', '-Werror']
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'java.awt.headless', 'true'
}

cyclonedxBom {
    includeConfigs = ['runtimeClasspath']
    outputFormat = 'json'
    outputName = 'tracewitness-platform-sbom'
    destination = file("$buildDir/reports/sbom")
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.register('runtimeDependencies') {
    doLast {
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each {
            println "${it.moduleVersion.id.group}:${it.moduleVersion.id.name}:${it.moduleVersion.id.version}"
        }
    }
}

bootRun {
    workingDir = file('..')
}
